services:
  - type: web
    name: speed-ia-basic
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: TIER
        value: BASIC

  - type: web
    name: speed-ia-video
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: TIER
        value: VIDEO

  - type: web
    name: speed-ia-studio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: TIER
        value: STUDIO
