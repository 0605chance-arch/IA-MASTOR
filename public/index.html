<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>IA MASTOR</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ÉCRAN DE VERROUILLAGE -->
  <div id="lock-screen" class="lock-screen">
    <div class="lock-card">
      <div class="logo">🚀 IA <em>MASTOR</em></div>
      <p style="color: var(--text-dim); margin-bottom: 20px; font-size: 14px;">Entrez votre clé API Agnes pour déverrouiller le studio.</p>
      <input type="password" id="api-key-input" class="input-field" placeholder="Collez votre clé ici..." style="margin-bottom: 15px;">
      <button id="unlock-btn" class="btn-primary" style="width: 100%;">Déverrouiller</button>
      <p id="lock-error" style="color: #ff453a; font-size: 12px; margin-top: 10px; display: none;"></p>
    </div>
  </div>

  <!-- APPLICATION -->
  <div class="app" id="main-app" style="display: none;">
    <header class="header">
      <div class="logo">🚀 IA <em>MASTOR</em></div>
      <p class="tagline">Chat • Image • Vidéo • Histoire</p>
      <button id="change-key-btn" style="background:transparent; border:1px solid var(--border); color:var(--text-dim); padding:6px 12px; border-radius:6px; font-size:12px; margin-top:10px; cursor:pointer;">🔑 Changer de clé</button>
    </header>

    <div class="tabs">
      <button id="tab-chat" class="tab-btn active">💬 Chat</button>
      <button id="tab-image" class="tab-btn">🖼️ Image</button>
      <button id="tab-video" class="tab-btn">🎬 Vidéo</button>
      <button id="tab-story" class="tab-btn">📖 Histoire</button>
    </div>

    <main class="main">
      <!-- ONGLET CHAT -->
      <section id="section-chat" class="section active">
        <div class="chat-layout">
          <aside class="chat-sidebar" id="chat-sidebar">
            <button id="new-chat-btn" class="btn-secondary" style="width:100%; margin-bottom:10px;">+ Nouvelle conversation</button>
            <div id="chat-sessions-list" class="sessions-list"></div>
          </aside>
          <div class="chat-main">
            <div id="chat-history" class="chat-history"></div>
            <div class="chat-input-area">
              <input type="file" id="chat-image-upload" accept="image/*" hidden>
              <button id="chat-image-btn" class="btn-secondary" style="padding: 10px 14px; border-radius: 50%;">📷</button>
              <textarea id="chat-input" placeholder="Envoyez un message..." rows="1"></textarea>
              <button id="chat-send" class="btn-primary">⬆️</button>
            </div>
          </div>
        </div>
      </section>

      <!-- ONGLET IMAGE -->
      <section id="section-image" class="section">
        <div class="card">
          <textarea id="image-prompt" class="input-field" rows="3" placeholder="Décrivez l'image..."></textarea>
          <div class="upload-area">
            <input type="file" id="image-upload" accept="image/*" hidden>
            <button id="image-upload-btn" class="btn-secondary">📷 Image de référence</button>
            <div id="image-preview" class="preview"></div>
          </div>
          <select id="image-format" class="input-field">
            <option value="9:16">Portrait (9:16)</option>
            <option value="16:9">Paysage (16:9)</option>
            <option value="1:1">Carré (1:1)</option>
          </select>
          <button id="image-generate" class="btn-primary">Générer l'image</button>
        </div>
        <div id="image-result-area" class="result-area" hidden>
          <img id="image-result" src="" alt="Résultat">
          <a id="image-download" class="btn-download" download>Télécharger</a>
        </div>
        <div class="history-section">
          <h3>Historique des images</h3>
          <div id="image-history" class="history-grid"></div>
        </div>
      </section>

      <!-- ONGLET VIDÉO -->
      <section id="section-video" class="section">
        <div class="video-slots" id="video-slots"></div>
        <div class="history-section">
          <h3>Bibliothèque vidéo</h3>
          <div id="video-history" class="history-grid"></div>
        </div>
      </section>

      <!-- ONGLET HISTOIRE -->
      <section id="section-story" class="section">
        <div class="card" style="margin-bottom: 16px;">
          <h3 style="margin-bottom: 10px; font-size: 16px;">👥 Personnages</h3>
          <div style="display: flex; gap: 10px;">
            <div style="flex: 1; text-align: center;">
              <input type="text" id="char1-name" class="input-field" placeholder="Nom 1" style="margin-bottom:5px; text-align:center;">
              <input type="file" id="char1-file" accept="image/*" hidden>
              <button class="btn-secondary" onclick="document.getElementById('char1-file').click()" style="width: 100%; padding: 10px 0;">📷 1</button>
              <div id="char1-prev" class="preview"></div>
            </div>
            <div style="flex: 1; text-align: center;">
              <input type="text" id="char2-name" class="input-field" placeholder="Nom 2" style="margin-bottom:5px; text-align:center;">
              <input type="file" id="char2-file" accept="image/*" hidden>
              <button class="btn-secondary" onclick="document.getElementById('char2-file').click()" style="width: 100%; padding: 10px 0;">📷 2</button>
              <div id="char2-prev" class="preview"></div>
            </div>
            <div style="flex: 1; text-align: center;">
              <input type="text" id="char3-name" class="input-field" placeholder="Nom 3" style="margin-bottom:5px; text-align:center;">
              <input type="file" id="char3-file" accept="image/*" hidden>
              <button class="btn-secondary" onclick="document.getElementById('char3-file').click()" style="width: 100%; padding: 10px 0;">📷 3</button>
              <div id="char3-prev" class="preview"></div>
            </div>
          </div>
        </div>
        <div class="video-slots" id="story-slots"></div>
      </section>
    </main>
  </div>

  <!-- TEMPLATE POUR LES BLOCS VIDÉO -->
  <template id="slot-template">
    <div class="slot card">
      <div class="slot-header">
        <span class="slot-num">#1</span>
        <span class="slot-status" data-state="idle"><span class="dot"></span> En attente</span>
      </div>
      <textarea class="slot-prompt input-field" rows="2" placeholder="Décrivez la scène..."></textarea>
      <div class="slot-upload">
        <input type="file" class="slot-img-input" accept="image/*" hidden>
        <button class="slot-upload-btn btn-secondary">📷 Image de scène</button>
      </div>
      <div class="slot-options">
        <select class="slot-format input-field">
          <option value="9:16">9:16</option>
          <option value="16:9">16:9</option>
          <option value="1:1">1:1</option>
        </select>
        <select class="slot-duration input-field">
          <option value="4">4s</option>
          <option value="8" selected>8s</option>
          <option value="12">12s</option>
        </select>
      </div>
      <div class="slot-actions">
        <button class="slot-gen-btn btn-primary">Générer</button>
        <button class="slot-dl-btn btn-download" disabled>Télécharger</button>
      </div>
      <div class="slot-player" hidden><video controls playsinline></video></div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
